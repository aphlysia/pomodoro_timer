<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f5f5">
  <title>ポモドーロタイマー</title>
  <style>
    :root {
      font-family: system-ui, sans-serif;
      color: #222;
      background: #f5f5f5;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .app { width: min(100%, 460px); text-align: center; }
    .device {
      display: grid;
      grid-template-columns: 56px minmax(0, 1fr) 56px;
      align-items: center;
      gap: clamp(12px, 4vw, 28px);
      padding: 28px clamp(16px, 5vw, 36px);
      border-radius: 12px;
      background: #171717;
    }
    .screen { min-width: 0; }
    .matrix { width: min(100%, 230px); aspect-ratio: 1; margin: auto; display: grid; grid-template-columns: repeat(5, 1fr); gap: clamp(6px, 2vw, 11px); align-items: center; justify-items: center; }
    .led { width: 50%; aspect-ratio: 1; border-radius: 2px; background: #ed332b; }
    .led.off { background: #33201f; }
    .led.current { animation: blink 1s steps(1, end) infinite; }
    .paused .matrix { animation: blink .8s steps(1, end) infinite; }
    .paused .led.current { animation: none; }
    .complete .led { background: #33201f; }
    @keyframes blink { 50% { opacity: .2; } }
    .button-wrap { display: grid; justify-items: center; }
    .physical-button {
      position: relative;
      width: 48px; height: 48px; padding: 0;
      border: 0; border-radius: 3px;
      background: #aaa;
      cursor: pointer;
    }
    .physical-button::after { content: ""; position: absolute; inset: 11px; border-radius: 50%; background: #222; }
    .physical-button:active { background: #888; }
    .physical-button:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <main class="app">
    <section class="device" aria-label="25 分のポモドーロタイマー">
      <div class="button-wrap"><button class="physical-button" id="left" type="button" aria-label="開始・一時停止・再開"></button></div>
      <div class="screen" id="screen">
        <div class="matrix" id="matrix" role="img" aria-label="25 個の LED：すべて点灯"></div>
        <span class="sr-only" id="time" aria-live="off">25:00</span>
        <span class="sr-only" id="status" aria-live="polite">準備完了</span>
      </div>
      <div class="button-wrap"><button class="physical-button" id="right" type="button" aria-label="リセット"></button></div>
    </section>
  </main>
  <script>
    (() => {
      const DURATION = 25 * 60;
      const matrix = document.getElementById('matrix');
      const screen = document.getElementById('screen');
      const timeDisplay = document.getElementById('time');
      const statusDisplay = document.getElementById('status');
      const leds = Array.from({ length: 25 }, (_, index) => {
        const led = document.createElement('span');
        led.className = 'led future';
        led.setAttribute('aria-hidden', 'true');
        matrix.append(led);
        return led;
      });

      let state = 'ready';
      let elapsedBeforeRun = 0;
      let startedAt = 0;
      let frame = 0;

      function elapsedSeconds() {
        return state === 'running'
          ? Math.min(DURATION, elapsedBeforeRun + (performance.now() - startedAt) / 1000)
          : elapsedBeforeRun;
      }

      function render() {
        const elapsed = elapsedSeconds();
        const remaining = Math.max(0, Math.ceil(DURATION - elapsed));
        const minutes = Math.floor(remaining / 60);
        const seconds = remaining % 60;
        timeDisplay.textContent = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;

        const passedMinutes = Math.min(25, Math.floor(elapsed / 60));
        leds.forEach((led, index) => {
          led.className = 'led ' + (index < passedMinutes ? 'off' : index === passedMinutes && state !== 'ready' && state !== 'complete' ? 'current' : 'future');
        });
        screen.classList.toggle('paused', state === 'paused');
        screen.classList.toggle('complete', state === 'complete');
        const labels = {
          ready: 'READY · はじめましょう',
          running: 'FOCUS · 集中中',
          paused: 'PAUSED · 一時停止中',
          complete: 'DONE · おつかれさま！'
        };
        statusDisplay.textContent = labels[state];
        matrix.setAttribute('aria-label', state === 'complete' ? '25 個の LED：すべて消灯' : state === 'ready' ? '25 個の LED：すべて点灯' : `${passedMinutes} 分経過`);
      }

      function tick() {
        if (state !== 'running') return;
        if (elapsedSeconds() >= DURATION) {
          elapsedBeforeRun = DURATION;
          state = 'complete';
          render();
          return;
        }
        render();
        frame = window.setTimeout(tick, 100);
      }

      function toggle() {
        if (state === 'ready') {
          state = 'running';
          startedAt = performance.now();
          tick();
        } else if (state === 'running') {
          elapsedBeforeRun = elapsedSeconds();
          state = 'paused';
          window.clearTimeout(frame);
          render();
        } else if (state === 'paused') {
          state = 'running';
          startedAt = performance.now();
          tick();
        } else {
          reset();
        }
      }

      function start() {
        window.clearTimeout(frame);
        elapsedBeforeRun = 0;
        startedAt = performance.now();
        state = 'running';
        tick();
      }

      function reset() {
        window.clearTimeout(frame);
        state = 'ready';
        elapsedBeforeRun = 0;
        startedAt = 0;
        render();
      }

      document.getElementById('left').addEventListener('click', toggle);
      document.getElementById('right').addEventListener('click', () => {
        if (state === 'complete') start();
        else reset();
      });
      document.addEventListener('keydown', event => {
        if (event.repeat || event.altKey || event.ctrlKey || event.metaKey) return;
        if (event.key.toLowerCase() === 'a') { event.preventDefault(); toggle(); }
        if (event.key.toLowerCase() === 'b') { event.preventDefault(); reset(); }
      });
      render();
    })();
  </script>
</body>
</html>
